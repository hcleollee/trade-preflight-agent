  <rect x="0" y="945" width="1920" height="135" fill="#101010"/>
  <text x="80" y="1002" font-family="Arial Unicode MS,Arial" font-size="24" font-weight="700" fill="#fff">Fresh data and a second PASS are mandatory / 必须刷新行情并再次通过风控</text>
